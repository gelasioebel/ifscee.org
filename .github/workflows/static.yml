name: Test and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install gcc
        run: sudo apt-get update -y && sudo apt-get install -y gcc

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  stage:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage deployable files
        id: stage
        run: |
          mkdir -p staging
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.claude/' \
            --exclude='ifscee001/' \
            --exclude='ifscee2/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='staging/' \
            --exclude='package*.json' \
            --exclude='package-lock.json' \
            --exclude='vitest.config.js' \
            --exclude='.gitignore' \
            --exclude='.DS_Store' \
            --exclude='README*.md' \
            ./ staging/
          echo "Staged contents:"
          find staging -maxdepth 2 -type f -o -type d | sort
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging
          path: staging/
          retention-days: 1

  deploy-pages:
    needs: stage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: staging
          path: staging

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    needs: stage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: staging
          path: staging

      - name: Deploy via SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 167.234.233.215 >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          echo '#!/bin/sh' > /tmp/askpass.sh
          echo 'echo "$SSH_PASSPHRASE"' >> /tmp/askpass.sh
          chmod +x /tmp/askpass.sh
          SSH_ASKPASS=/tmp/askpass.sh SSH_ASKPASS_REQUIRE=force SSH_PASSPHRASE="${{ secrets.SSH_PASSPHRASE }}" ssh-add ~/.ssh/id_deploy
          scp -r staging/* root@167.234.233.215:/var/www/htdocs/ifscee/
          rm -f /tmp/askpass.sh
          ssh-agent -k

      - name: Smoke test live site
        run: |
          sleep 5
          for i in 1 2 3; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "https://ifscee.org/ifscee/" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Smoke test passed (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code; retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed after 3 attempts."
          exit 1
